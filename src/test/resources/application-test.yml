spring:
  datasource:
    url: jdbc:h2:mem:gitpulse_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.session_factory.statement_inspector: com.gitpulse.domain.evolution.H2TestStatementInspector
  cache:
    type: none
  kafka:
    listener:
      auto-startup: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: gitpulse-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.gitpulse.*"

kafka:
  topics:
    auto-create: false
    analysis-jobs: test-analysis-jobs
    analysis-jobs-dlt: test-analysis-jobs.DLT
  consumer:
    group-id: gitpulse-test-group
    concurrency: 1
