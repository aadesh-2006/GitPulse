spring:
  application:
    name: gitpulse
  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gitpulse}
    username: ${DB_USERNAME:gitpulse}
    password: ${DB_PASSWORD:gitpulse}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:gitpulse-analysis-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.gitpulse.*"

kafka:
  topics:
    analysis-jobs: ${KAFKA_TOPIC_ANALYSIS_JOBS:analysis-jobs}
    analysis-jobs-dlt: ${KAFKA_TOPIC_ANALYSIS_JOBS_DLT:analysis-jobs.DLT}
  consumer:
    group-id: ${KAFKA_CONSUMER_GROUP:gitpulse-analysis-group}
    concurrency: ${KAFKA_CONSUMER_CONCURRENCY:1}

github:
  api:
    base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    connect-timeout: ${GITHUB_CONNECT_TIMEOUT:5s}
    read-timeout: ${GITHUB_READ_TIMEOUT:10s}
    commit-page-size: ${GITHUB_COMMIT_PAGE_SIZE:30}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
