services:
  postgres:
    image: postgres:16-alpine
    container_name: gitpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gitpulse}
      POSTGRES_USER: ${DB_USERNAME:-gitpulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gitpulse}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gitpulse} -d ${DB_NAME:-gitpulse}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
